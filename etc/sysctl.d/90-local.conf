# Artix has no systemd 50-default.conf, so set its link and file protections here.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 1
fs.protected_regular = 1
kernel.kptr_restrict = 1

# This laptop routes nothing: ignore and send no ICMP redirects, drop spoofed sources.
# Globs also reach interfaces that exist before sysctl runs at boot.
net.ipv4.conf.*.accept_redirects = 0
net.ipv6.conf.*.accept_redirects = 0
net.ipv4.conf.*.send_redirects = 0
net.ipv4.conf.*.rp_filter = 2

# Battery: no NMI watchdog timer interrupts.
kernel.nmi_watchdog = 0
