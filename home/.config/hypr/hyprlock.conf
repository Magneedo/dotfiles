# The lock screen (dwl's Mod+Shift+L and swayidle): the swaylock ring it
# replaced, plus the last notifications (see notifications).
general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = false
}

# Fingerprint or password, at the same time. hyprlock's own PAM service
# includes pam_fprintd, which would hold the password prompt until the
# reader times out, so the password goes through system-login instead.
auth {
    pam {
        module = system-login
    }
    fingerprint {
        enabled = true
    }
}

background {
    monitor =
    path = ~/Pictures/Lockscreen/Lockscreen.jpg
    color = rgb(000000)
}

# swaylock's ring: radius 200 and 25 thick at the panel's 1.5 scale, hidden
# until typing, with a white arc per key. Sizes here are physical pixels,
# with the outline outside size.
input-field {
    monitor =
    size = 563, 563
    outline_thickness = 37
    rounding = -1
    outer_color = rgb(005577)
    inner_color = rgba(00000000)
    check_color = rgb(005577)
    fail_color = rgb(005577)
    capslock_color = rgb(005577)
    font_color = rgb(ffffff)
    hide_input = true
    hide_input_base_color = rgb(ffffff)
    fade_on_empty = true
    placeholder_text =
    fail_text = Wrong
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:5000] notifications
    text_align = left
    font_family = Noto Sans Mono
    font_size = 16
    color = rgb(ffffff)
    position = -30, -30
    halign = right
    valign = top
}
