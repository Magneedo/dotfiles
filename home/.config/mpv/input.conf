# Profile toggles
Ctrl+a apply-profile normal  ; show-text "Profile: Normal"
Ctrl+b apply-profile film   ; show-text "Profile: Film"
Ctrl+c apply-profile sports  ; show-text "Profile: Sports"

# Seek
LEFT  seek -5
RIGHT seek  5
DOWN  seek -30
UP    seek  30
Shift+LEFT  seek -120
Shift+RIGHT seek  120
